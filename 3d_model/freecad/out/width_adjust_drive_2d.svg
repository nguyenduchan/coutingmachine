<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 480 380">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c62828"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7f5f0"/>
  <text x="240" y="16" text-anchor="middle" font-size="13" font-family="Segoe UI,Arial" font-weight="600" fill="#222">Width_Adjust_Drive � printable helix + lid retainer</text>
  <text x="240" y="30" text-anchor="middle" font-size="9" font-family="Segoe UI,Arial" fill="#455a64">Male/female FDM threads (clear 0.4) | Collar trapped by Retainer_Base+Cap on Lid_Top</text>

  <!-- LONG YZ -->
  <g transform="translate(20,48)">
    <text x="200" y="0" text-anchor="middle" font-size="11" font-family="Segoe UI,Arial" font-weight="600" fill="#1565c0">1) Assembly along Y (looking +X)</text>
    <rect x="40" y="8" width="320" height="6" fill="#90a4ae" stroke="#455a64" stroke-width="1"/>
    <text x="365" y="14" font-size="7" font-family="Segoe UI,Arial" fill="#455a64">Lid_Top</text>
    <!-- retainer pad -->
    <rect x="300" y="14" width="50" height="8" fill="#42a5f5" stroke="#1565c0" stroke-width="1.2"/>
    <text x="325" y="28" text-anchor="middle" font-size="6" font-family="Segoe UI,Arial" fill="#1565c0">Retainer pad</text>
    <!-- screw -->
    <line x1="30" y1="70" x2="290" y2="70" stroke="#546e7a" stroke-width="5"/>
    <g stroke="#90a4ae" stroke-width="1.1">
      <line x1="70" y1="65" x2="76" y2="75"/>
      <line x1="100" y1="65" x2="106" y2="75"/>
      <line x1="130" y1="65" x2="136" y2="75"/>
      <line x1="160" y1="65" x2="166" y2="75"/>
      <line x1="190" y1="65" x2="196" y2="75"/>
      <line x1="220" y1="65" x2="226" y2="75"/>
    </g>
    <text x="150" y="58" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#37474f">Helix male �8�3</text>
    <!-- nut -->
    <rect x="145" y="58" width="28" height="24" fill="#ff9800" stroke="#e65100" stroke-width="1.2"/>
    <text x="159" y="54" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#e65100">Nut ?</text>
    <!-- bar + rail -->
    <rect x="60" y="84" width="200" height="12" fill="#9c27b0" stroke="#4a148c" stroke-width="1.2" opacity="0.5"/>
    <rect x="55" y="96" width="210" height="4" fill="#66bb6a" stroke="#2e7d32" stroke-width="1"/>
    <text x="160" y="112" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#4a148c">Bar in rail (anti-rotate)</text>
    <!-- collar -->
    <rect x="288" y="60" width="10" height="20" fill="#78909c" stroke="#37474f" stroke-width="1.2"/>
    <text x="293" y="54" text-anchor="middle" font-size="6" font-family="Segoe UI,Arial" fill="#37474f">Collar</text>
    <!-- retainer body -->
    <rect x="280" y="48" width="40" height="44" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="300" y="100" text-anchor="middle" font-size="6" font-family="Segoe UI,Arial" fill="#1565c0">Base+Cap</text>
    <!-- knob -->
    <rect x="330" y="52" width="24" height="36" rx="4" fill="#ce93d8" stroke="#6a1b9a" stroke-width="1.3"/>
    <text x="342" y="48" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#4a148c">Knob</text>
    <path d="M348 46 A7 7 0 1 1 354 42" fill="none" stroke="#6a1b9a" stroke-width="1.2"/>
    <path d="M200 90 L230 90" stroke="#c62828" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="215" y="122" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#c62828">bar +/-Y when knob turns</text>
  </g>

  <!-- RETAINER DETAIL -->
  <g transform="translate(20,185)">
    <text x="100" y="0" text-anchor="middle" font-size="11" font-family="Segoe UI,Arial" font-weight="600" fill="#1565c0">2) How knob stays on the lid</text>
    <text x="100" y="12" text-anchor="middle" font-size="8" font-family="Segoe UI,Arial" fill="#607d8b">XZ section at collar � axial lock</text>
    <rect x="30" y="20" width="140" height="8" fill="#90a4ae" stroke="#455a64"/>
    <text x="175" y="28" font-size="6" font-family="Segoe UI,Arial" fill="#455a64">Lid_Top</text>
    <rect x="55" y="28" width="90" height="10" fill="#42a5f5" stroke="#1565c0"/>
    <text x="100" y="36" text-anchor="middle" font-size="6" font-family="Segoe UI,Arial" fill="#0d47a1">pad + 2�M3</text>
    <!-- base upper / cap lower -->
    <path d="M60 50 L60 70 L85 70 L85 62 L115 62 L115 70 L140 70 L140 50 Z" fill="#90caf9" stroke="#1565c0" stroke-width="1.3"/>
    <rect x="60" y="78" width="80" height="22" fill="#64b5f6" stroke="#1565c0" stroke-width="1.3"/>
    <text x="100" y="92" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#0d47a1">Retainer_Cap</text>
    <text x="48" y="62" text-anchor="end" font-size="6" font-family="Segoe UI,Arial" fill="#1565c0">Base</text>
    <!-- collar trapped -->
    <circle cx="100" cy="70" r="12" fill="#78909c" stroke="#37474f" stroke-width="1.3"/>
    <circle cx="100" cy="70" r="5" fill="#546e7a"/>
    <text x="100" y="118" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#37474f">Collar trapped ? no axial pull-out</text>
    <text x="100" y="130" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#37474f">Screw still free to rotate</text>
  </g>

  <!-- THREAD FIT -->
  <g transform="translate(240,185)">
    <text x="110" y="0" text-anchor="middle" font-size="11" font-family="Segoe UI,Arial" font-weight="600" fill="#1565c0">3) Thread fit (FDM)</text>
    <rect x="20" y="20" width="80" height="70" fill="#eceff1" stroke="#546e7a"/>
    <text x="60" y="35" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#37474f">Screw major �8</text>
    <text x="60" y="50" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#37474f">pitch 3 / depth 1.1</text>
    <text x="60" y="65" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#37474f">helix segments</text>
    <text x="60" y="80" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#2e7d32">male solid</text>
    <rect x="120" y="20" width="80" height="70" fill="#fff3e0" stroke="#e65100"/>
    <text x="160" y="35" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#e65100">Nut cut by</text>
    <text x="160" y="50" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#e65100">same helix</text>
    <text x="160" y="65" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#e65100">+0.40 mm radial</text>
    <text x="160" y="80" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#2e7d32">female match</text>
    <text x="110" y="110" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#455a64">Print 0.2 mm layer; clean thread; test fit</text>
    <text x="110" y="124" text-anchor="middle" font-size="7" font-family="Segoe UI,Arial" fill="#455a64">If tight: raise thread_clear_r to 0.5</text>
  </g>

  <!-- CHAIN -->
  <g transform="translate(20,330)">
    <text x="220" y="0" text-anchor="middle" font-size="10" font-family="Segoe UI,Arial" font-weight="600" fill="#1565c0">Assemble: rail?screw(drop collar into Base)?Cap+2�M3?nut on bar?knob turns, bar slides, screw stays on lid</text>
  </g>

  <text x="240" y="368" text-anchor="middle" font-size="8" font-family="Segoe UI,Arial" fill="#546e7a">width_adjust_drive_2d.svg � functional helix + collar retainer</text>
</svg>
